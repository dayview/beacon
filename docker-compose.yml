services:
  backend:
    build:
      context: ./beacon-backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    env_file:
      - ./beacon-backend/.env
    environment:
      - PORT=3001
    volumes:
      - ./beacon-backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - BACKEND_PROXY_TARGET=http://backend:3001
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
